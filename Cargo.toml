[workspace]
resolver = "2"
members = ["boat-cli", "boat-lib"]

[workspace.package]
version = "1.0.1"
edition = "2024"
authors = ["Coko <91132775+Coko7@users.noreply.github.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/coko7/boat"

[workspace.dependencies]
boat-lib = { path = "boat-lib", version = "1.0.1" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
env_logger = "0.11.9"
log = "0.4.29"
rusqlite = "0.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.8"
